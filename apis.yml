aid: renibus-therapeutics
name: Rénibus Therapeutics
description: 'Rénibus Therapeutics is a privately held clinical-stage biopharmaceutical
  company headquartered in Southlake, Texas, developing treatments for cardio, renal
  and metabolic disease. Its pipeline is led by veverimer, a non-absorbed polymer in
  Phase 3 for metabolic acidosis in chronic kidney disease, and RBT-1 (stannic protoporfin
  / iron sucrose), a first-in-class intravenous pharmacologic preconditioning agent
  given 24-48 hours before non-emergent cardiac surgery to reduce post-operative complications,
  which holds FDA Breakthrough Therapy and Fast Track designations and completed the
  pivotal Phase 3 PROTECT trial. The company publishes a corporate marketing site,
  a news and events feed, an expanded access policy and patient information, but operates
  no developer program, public API, or machine-readable API contract.'
